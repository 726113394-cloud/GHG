menu.flow.book-name: "§6GHG field manual"
menu.flow.page: "§7Page {0}/{1}"
menu.flow.prev: "§7<- Previous page"
menu.flow.next: "§7Next page ->"
menu.flow.p1: "§f1. Preparation§7 (25s)\nMove freely, break supply boxes, pick a role (menu pops up).\nAltars cannot be charged yet; the Mother is rooted.\n§f2. Hunt§7\nHold Shift on an altar to charge the shared bar;\nthe Mother within 6 blocks pushes it back.\n§f3. Escape§7\nAt 100% a random altar becomes the escape point -\nhold Shift for 4s. With one survivor left a hatch opens."
menu.flow.p2: "§fEvery key action is Shift§7\ncharge / rescue / heal / self-heal / escape / carry / struggle.\nLeft click is the Mother axe, right click is skills and items.\n§fAll altars share one bar§7\n0.9%/s solo (1.125% for the Engineer), no stacking.\nGuarded by the Mother it drops 0.6%/s;\nshe can also harden an altar for 50s by smashing it."
menu.flow.p3: "§fFirst hit injures, second downs§7\nEach hit grants Speed II for 2s, then Slowness I for 1.5s.\nInjuries heal: teammate 8s / yourself 20s (needs food >= 8).\n§fOnce downed§7\nThe Mother can pin you to an altar: 60 -> 30 -> 5s and out.\nA teammate holding Shift for 4s frees you (you come back injured);\nleft alone you crawl back to injured after 15s."
menu.flow.p4: "§fWin and loss§7\nOne escape -> survivors win; everyone downed -> Mother wins.\nTime out (20 min) is a draw.\n§fHow money is split§7\nEntry 50 + server bonus 500 form the pool, split by action score:\ncharge 2/s, rescue 15, escape 25; hit 5, down 10, eliminate 40.\nThe Mother only takes from the bonus, at most 50%."
