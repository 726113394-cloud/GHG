# ---- 选择菜单里的详细描述（/ghg kind 与 /ghg role）----
hunter.mother.kind.desc.sprinter: "§eSpeed§7: a short burst of speed to close a straight line"
hunter.mother.kind.desc.charger: "§cBurst§7: dash straight ahead; whoever is hit gets stunned"
hunter.mother.kind.desc.archer: "§cRanged§7: one shot from afar that counts as a normal injury"
hunter.mother.kind.desc.alchemist: "§dControl§7: throw a slow from range and cut off rotations"
hunter.mother.kind.desc.walker: "§bEngage§7: teleport right behind a target; you freeze briefly"
hunter.mother.kind.desc.watcher: "§5Stealth§7: approach invisible and pick off stragglers"
hunter.mother.kind.desc.weaver: "§aArea§7: a slow-net around yourself that punishes grouping"
hunter.mother.kind.desc.pearl_lady: "§dRusher§7: blinks straight onto the altar, but pays with a slow first step — hit someone fast or waste it"
hunter.skill.sprint.desc: "Grants Speed I for 6 seconds.\nBest for straight-line chases and cutting off rescues."
hunter.skill.dash.desc: "Dashes roughly 8-9 blocks in the direction you aim.\nHit someone (2.2 block radius) -> 2s stun;\nthe Mother herself gets no debuff.\nAn AI Mother dashes at the nearest survivor instead."
hunter.skill.arrow.desc: "Fires a bone arrow; a hit counts as one normal injury (2 hits down).\nNo slow at all - pure damage traded for range."
hunter.skill.bolt.desc: "The bolt bursts into a splash potion where it lands,\ngiving survivors within 3 blocks Slowness I for 3s."
hunter.skill.teleport.desc: "Teleports about 1.8 blocks behind the target.\nYou are then frozen for 2 seconds."
hunter.skill.vanish.desc: "Invisibility + Speed II for 7 seconds.\nHitting a survivor removes the speed (invisibility stays)."
hunter.skill.snare.desc: "Spins out a slow-net around yourself,\ngiving survivors within 7 blocks Slowness I for 3s."
hunter.skill.pearl.desc: "Blinks about 10 blocks toward your crosshair (the Mother version of the teleport pearl).\nAfter landing you get Slowness I for 4s;\nhit a survivor within those 4s and it clears instantly, replaced by the 2s attack recovery.\nAn AI Mother blinks behind her target instead."
