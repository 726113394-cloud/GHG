hunter.kindmenu.lore-cooldown: "§7Cooldown: §f{0}s"
hunter.kindmenu.lore-cooldown-none: "§7Cooldown: §fnone (passive)"
hunter.kindmenu.lore-cost: "§7Entry cost: §f{0}"
hunter.kindmenu.lore-cost-free: "§7Entry cost: §afree"
hunter.kindmenu.lore-passive: "§7Passive: §f{0}"
hunter.kindmenu.passive-common: "Sight - stand still for 3s and survivors within 40 blocks glow"
hunter.role.effect.icer: "Right-click to throw the Ice Ball.\nHit the Mother -> 4s stun; if she is carrying someone,\nthat survivor drops free.\nNot offered in AI-Mother matches (nobody to hit)."
hunter.role.passive.icer: "None"
hunter.role.effect.guardian: "Right-click the Charm: rescue progress x3 for 15 seconds.\nYou still have to stand next to the target and hold Shift."
hunter.role.passive.guardian: "Rescue and heal progress x1.3"
hunter.role.effect.lancer: "Right-click the Spear to lunge roughly 4-5 blocks.\nGood for crossing gaps and dodging one swing."
hunter.role.passive.lancer: "Heartbeat range x1.5 (hear the Mother earlier)"
hunter.role.effect.engineer: "Right-click to raise a 3x2 wooden fence at your crosshair.\nIt takes 3 hits to break: the Mother and engineers can,\nother survivors cannot."
hunter.role.passive.engineer: "Altar charge cap x1.25 (1.125%/s)"
hunter.role.effect.runner: "Right-click Adrenaline: Speed I for 4 seconds,\nthen 2 seconds of Slowness (GHG weakened version)."
hunter.role.passive.runner: "None"
hunter.role.effect.wraith: "Right-click the Shadow Cloak: invisible for 6s.\nThe Mother passive sight (3s standing still) applies Glowing,\nwhich outlines you even while invisible."
hunter.role.passive.wraith: "None"
