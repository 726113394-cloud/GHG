ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- leave the current match\n§e/ghg join §7- join the queue (auto-starts once enough players)\n§e/ghg info §7- show your own status\n§e/ghg kind §7- open the Mother kind menu (preparation phase)\n§e/ghg lang <locale> §7- switch your language\n§e/ghg help §7- show this help\n§e/ghg §7- open the GUI menu (no commands to memorise)\n§7Gameplay: the AI Mother hunts you down; break every altar, then escape. Admin commands: §f/ghga help\n§e/ghg spectate §7- join/leave spectator mode (when a match is running)"
ghg.help.admin: "§6========== GHG admin commands ==========\n§7[Match]\n§e/ghga hunter start [players...] §7- start with an AI Mother (no names = everyone in the area)\n§e/ghga hunter mother <player> [survivors...] §7- start with a player as the Mother\n§e/ghga hunter kind [kind] §7- pick the Mother kind (no argument = open the menu)\n§e/ghga hunter stop | status | stats §7- stop / status / recent results\n§e/ghga hunter test [mother] §7- single-player test match\n§e/ghga hunter queue [start|stop] §7- show queue / start now / clear\n§7[Hunting ground]\n§e/ghga tool §7- get the selection tool (wheat)\n§e/ghga pos1 | pos2 §7- set both corners (or left/right click with the tool)\n§e/ghga save <name> | list | load <name> | delete <name> §7- area management\n§7[Other]\n§e/ghga giveitem <item id> §7- give one item\n§e/ghga reload | selftest | lang <locale> | status §7- maintenance"
