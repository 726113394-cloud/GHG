menu.flow.page: "§7{0}/{1} ページ"
menu.flow.prev: "§7← 前のページ"
menu.flow.next: "§7次のページ →"
menu.flow.p1: "§f1. 準備フェーズ§7（25 秒）\n自由に動ける。物資箱を壊し、職業を選ぶ（メニュー自動表示）。\n法陣はまだ破れず、母体は固定。\n§f2. 狩りフェーズ§7\n法陣の上で Shift を押し続けると共有ゲージが伸びる。\n母体が 6 ブロック以内に入ると押し戻される。\n§f3. 脱出フェーズ§7\n100% になるとランダムな法陣が脱出地点に。Shift を 4 秒。\n残り 1 人になると地下倉庫が開き、単独で脱出できる。"
menu.flow.p2: "§f主要な操作はすべて Shift§7\n法陣 / 救助 / 治療 / 自己治療 / 脱出 / 担ぐ / 振りほどく。\n左クリックは母体の斧、右クリックはスキルと道具。\n§f法陣は 1 本の共有ゲージ§7\n単独 0.9%/秒（エンジニアは 1.125%）、人数分は加算されない。\n母体が守ると毎秒 0.6% ずつ下がる。\n赤石ブロックを壊されると 50 秒間強化される。"
menu.flow.p3: "§f1 発で負傷、2 発でダウン§7\n命中時は速度Ⅱ 2 秒、その後 移動速度低下Ⅰ 1.5 秒。\n負傷は治療可能：味方 8 秒 / 自分 20 秒（満腹度 8 以上）。\n§fダウン後§7\n母体は法陣に磔にできる：60 → 30 → 5 秒で放出。\n味方が Shift 4 秒で解体救助（救助後は負傷状態）。\n放置すると 15 秒で自力で負傷状態に戻る。"
menu.flow.p4: "§f勝敗§7\n1 人でも脱出成功 → 逃生者側の勝ち。全滅 → 母体の勝ち。\n時間切れ（20 分）は引き分け。\n§f賞金の分配§7\n参加費 50 ＋ サーバー保証 500 がプール。行動点で分配：\n法陣 毎秒 2、救助 15、脱出 25。母体は命中 5、ダウン 10、放出 40。\n母体が受け取るのは保証分のみで上限 50%。"
