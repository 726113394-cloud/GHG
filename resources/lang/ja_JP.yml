hunter.kindmenu.passive-common: "透視 —— 3 秒静止すると 40 ブロック内の逃生者が発光"
hunter.role.effect.icer: "右クリックで凝氷球を投擲。\n母体に命中 → 4 秒スタン。誰かを運んでいる場合は\n担がれていた逃生者がその場に落ちる。\nAI 母体の試合では配布されない（狙う相手がいない）。"
hunter.role.passive.icer: "なし"
hunter.role.effect.guardian: "右クリックで救済の護符：15 秒間、救助の進捗 ×3。\n遠隔救助はできず、対象の隣で Shift を押し続ける必要がある。"
hunter.role.passive.guardian: "救助・治療の進捗 ×1.3"
hunter.role.effect.lancer: "右クリックで前方へ約 4〜5 ブロック突進。\n穴を越える、一撃をかわす用途に向く。"
hunter.role.passive.lancer: "鼓動の聞こえる距離 ×1.5"
hunter.role.effect.engineer: "右クリックで照準位置に 3×2 の木柵を設置。\n3 回叩かれると壊れる：母体とエンジニアは壊せるが、\n他の逃生者は壊せない。"
hunter.role.passive.engineer: "法陣の蓄積上限 ×1.25（1.125%/秒）"
hunter.role.effect.runner: "右クリックでアドレナリン：速度Ⅰ 4 秒、\nその後 2 秒の移動速度低下（GHG 調整版）。"
hunter.role.passive.runner: "なし"
