ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- 現在の試合から退出\n§e/ghg join §7- キューに参加（人数が揃えば自動開始）\n§e/ghg info §7- 自分の状態を表示\n§e/ghg kind §7- 母体の種類メニューを開く（準備フェーズ）\n§e/ghg lang <言語> §7- 自分の表示言語を切り替え\n§e/ghg help §7- このヘルプを表示\n§e/ghg §7- GUI メニューを開く（コマンドを覚えなくて良い）\n§7遊び方：AI 母体に追われながら法陣をすべて破壊し、脱出地点から逃走します。管理者コマンドは §f/ghga help\n§e/ghg spectate §7- 観戦の入退場（試合中のみ）"
ghg.help.admin: "§6========== GHG 管理者コマンド ==========\n§7［試合］\n§e/ghga hunter start [プレイヤー...] §7- AI 母体で開始（名前なし＝区域内の全員）\n§e/ghga hunter mother <母体プレイヤー> [逃走者...] §7- プレイヤーを母体にして開始\n§e/ghga hunter kind [種類] §7- 母体の種類を選ぶ（引数なし＝メニュー）\n§e/ghga hunter stop | status | stats §7- 終了 / 状態 / 最近の戦績\n§e/ghga hunter test [mother] §7- ソロ試遊\n§e/ghga hunter queue [start|stop] §7- キュー表示 / 即開始 / 空にする\n§7［狩場の範囲指定］\n§e/ghga tool §7- 選択ツール（小麦）を取得\n§e/ghga pos1 | pos2 §7- 2 つの角を設定（ツールの左右クリックでも可）\n§e/ghga save <名前> | list | load <名前> | delete <名前> §7- エリア管理\n§7［その他］\n§e/ghga giveitem <アイテムID> §7- アイテムを 1 つ付与\n§e/ghga reload | selftest | lang <言語> | status §7- メンテナンス"
