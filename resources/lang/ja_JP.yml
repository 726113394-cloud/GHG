hunter.mother.kind.desc.sprinter: "§e速度型§7：短時間の加速で距離を詰める"
hunter.mother.kind.desc.charger: "§c突発型§7：直線ダッシュ、当たればスタン"
hunter.mother.kind.desc.archer: "§c遠距離型§7：離れた位置から一発、命中は通常の負傷"
hunter.mother.kind.desc.alchemist: "§d制圧型§7：遠距離から減速を投げ、移動ルートを切る"
hunter.mother.kind.desc.walker: "§b近接型§7：対象の背後へ瞬間移動。自分は硬直する"
hunter.mother.kind.desc.watcher: "§5隠密型§7：透明で接近し、はぐれた逃生者を狙う"
hunter.mother.kind.desc.weaver: "§a範囲型§7：自身中心の減速網。固まる相手に強い"
hunter.mother.kind.desc.pearl_lady: "§d突進型§7：法陣へ直接飛び込むが、最初の一歩が遅い。すぐ当てるか、捨てるか"
hunter.skill.sprint.desc: "自身に速度Ⅰを 6 秒付与。\n直線の追跡や救助の妨害に向く。"
hunter.skill.dash.desc: "視点方向へ約 8〜9 ブロック突進。\n命中（半径 2.2 ブロック）→ 相手を 2 秒スタン。\n母体自身にデバフはない。\nAI 母体は最も近い逃生者へ突進する。"
hunter.skill.arrow.desc: "骨矢を放つ。命中は通常の負傷 1 回（2 回でダウン）。\n減速は一切なし——射程で体力を削るタイプ。"
hunter.skill.bolt.desc: "弩の矢が着弾地点でスプラッシュポーションになる。\n半径 3 ブロック内の逃生者に移動速度低下Ⅰ 3 秒。"
hunter.skill.teleport.desc: "対象の背後約 1.8 ブロックへ瞬間移動。\n着地後 2 秒間は動けず攻撃もできない。"
hunter.skill.vanish.desc: "透明化＋速度Ⅱを 7 秒。\n逃生者に命中すると加速だけが消える（透明は残る）。"
hunter.skill.snare.desc: "自身を中心に減速網を展開。\n半径 7 ブロック内の逃生者に移動速度低下Ⅰ 3 秒。"
hunter.skill.pearl.desc: "照準方向へ約 10 ブロック転移（母体版テレポートパール）。\n着地後は自分に鈍足Ⅰ 4 秒；\nその間に逃生者へ命中すると鈍足は即解除され、\n攻撃時本来の 2 秒の硬直に置き換わる。\nAI 母体は対象の背後へ転移する。"
