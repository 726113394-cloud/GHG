hunter.kindmenu.lore-passive: "§7Pasiva: §f{0}"
hunter.kindmenu.passive-common: "Visión —— quédate quieta 3 s y los supervivientes a 40 bloques brillan"
hunter.role.effect.icer: "Clic derecho para lanzar la Bola de Hielo.\nImpacto en la Madre -> 4 s de aturdimiento; si lleva a alguien,\nel derribado cae al suelo.\nNo se reparte con Madre IA (no hay a quién golpear)."
hunter.role.passive.icer: "Ninguna"
hunter.role.effect.guardian: "Clic derecho con el Amuleto: progreso de rescate x3 durante 15 s.\nSigue siendo necesario estar al lado y mantener Shift."
hunter.role.passive.guardian: "Progreso de rescate y curación x1.3"
hunter.role.effect.lancer: "Clic derecho con la Lanza: avance de unos 4-5 bloques.\nSirve para cruzar huecos y esquivar un golpe."
hunter.role.passive.lancer: "Alcance del latido x1.5"
hunter.role.effect.engineer: "Clic derecho para levantar una valla de madera 3x2.\nAguanta 3 golpes: la Madre y los ingenieros pueden romperla,\nlos demás supervivientes no."
hunter.role.passive.engineer: "Tope de carga de altares x1.25 (1.125%/s)"
hunter.role.effect.runner: "Clic derecho con Adrenalina: Velocidad I 4 s,\ny luego 2 s de Lentitud (versión suavizada de GHG)."
hunter.role.passive.runner: "Ninguna"
hunter.role.effect.wraith: "Clic derecho en la Capa de sombra: invisible 6s.\nLa vista pasiva de la Madre (3s quieta) aplica Brillo,\nque perfila incluso estando invisible."
