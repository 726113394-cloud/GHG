menu.flow.p1: "§f1. Preparación§7 (25 s)\nMuévete, rompe cajas y elige rol (el menú sale solo).\nLos altares aún no cargan; la Madre está inmóvil.\n§f2. Caza§7\nMantén Shift sobre un altar para llenar la barra común;\nla Madre a 6 bloques la hace retroceder.\n§f3. Escape§7\nAl 100% un altar aleatorio se vuelve la salida: Shift 4 s.\nSi queda un solo superviviente se abre una escotilla."
menu.flow.p2: "§fToda acción clave es Shift§7\ncargar / rescatar / curar / autocurarse / escapar / cargar a alguien / zafarse.\nClic izquierdo es el hacha de la Madre, derecho habilidades y objetos.\n§fTodos los altares comparten barra§7\n0,9%/s en solitario (1,125% el ingeniero), no se acumula.\nCon la Madre vigilando baja 0,6%/s;\ny puede reforzar un altar 50 s rompiéndolo."
menu.flow.p3: "§fUn golpe hiere, dos derriban§7\nCada golpe da Velocidad II 2 s y luego Lentitud I 1,5 s.\nSe cura: compañero 8 s / tú 20 s (comida >= 8).\n§fYa derribado§7\nLa Madre puede clavarte en un altar: 60 -> 30 -> 5 s y fuera.\nUn compañero con Shift 4 s te libera (vuelves herido);\nsi nadie viene, te levantas herido a los 15 s."
menu.flow.p4: "§fVictoria y derrota§7\nUn escape -> ganan los supervivientes; todos derribados -> gana la Madre.\nEl tiempo (20 min) es empate.\n§fReparto del dinero§7\nEntrada 50 + bono 500 forman el bote, repartido por puntos de acción:\ncarga 2/s, rescate 15, escape 25; golpe 5, derribo 10, eliminación 40.\nLa Madre solo toma del bono, como máximo el 50%."
