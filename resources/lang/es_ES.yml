# ---- 选择菜单里的详细描述（/ghg kind 与 /ghg role）----
hunter.mother.kind.desc.sprinter: "§eVelocidad§7: un acelerón corto para cerrar distancias"
hunter.mother.kind.desc.charger: "§cImpulso§7: carrera recta; quien reciba el choque queda aturdido"
hunter.mother.kind.desc.archer: "§cDistancia§7: un disparo lejano que cuenta como herida normal"
hunter.mother.kind.desc.alchemist: "§dControl§7: lanza ralentización desde lejos y corta las rotaciones"
hunter.mother.kind.desc.walker: "§bEntrada§7: teletransporte tras el objetivo; tú quedas bloqueada"
hunter.mother.kind.desc.watcher: "§5Sigilo§7: acércate invisible y caza a los que se separan"
hunter.mother.kind.desc.weaver: "§aÁrea§7: red de ralentización a tu alrededor; castiga agruparse"
hunter.mother.kind.desc.pearl_lady: "§dEmbestida§7: salta directo al altar, pero paga con un primer paso lento: golpea rápido o será un salto en vano"
hunter.skill.sprint.desc: "Otorga Velocidad I durante 6 segundos.\nÚtil en persecuciones rectas y para cortar rescates."
hunter.skill.dash.desc: "Embestida de unos 8-9 bloques en la dirección que apuntas.\nSi impacta (radio 2.2) el objetivo queda aturdido 2 s;\nla Madre no recibe ninguna penalización.\nLa Madre IA embiste hacia el superviviente más cercano."
hunter.skill.arrow.desc: "Dispara una flecha de hueso; el impacto cuenta como una herida normal (2 = derribo).\nSin ralentización: daño puro a cambio de alcance."
hunter.skill.bolt.desc: "El virote estalla en una poción arrojadiza al impactar,\ndando Lentitud I 3 s en un radio de 3 bloques."
hunter.skill.teleport.desc: "Te teletransporta unos 1.8 bloques detrás del objetivo.\nDespués quedas bloqueada 2 segundos."
hunter.skill.vanish.desc: "Invisibilidad + Velocidad II durante 7 segundos.\nAl golpear a un superviviente pierdes la velocidad (la invisibilidad sigue)."
hunter.skill.snare.desc: "Despliega una red de ralentización a tu alrededor:\nLentitud I 3 s en un radio de 7 bloques."
hunter.skill.pearl.desc: "Salta unos 10 bloques hacia tu mira (la versión de la Madre de la perla de teletransporte).\nTras aterrizar recibes Lentitud I 4s;\nsi golpeas a un superviviente en esos 4s, se quita al instante\ny la sustituye la recarga de 2s del ataque.\nLa Madre IA salta detrás de su objetivo."
