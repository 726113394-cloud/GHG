# ---- GHG 自有文案（新键，旧键一律保留） ----
ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- salir de la partida actual\n§e/ghg join §7- entrar en la cola (empieza sola al haber suficientes)\n§e/ghg info §7- ver tu propio estado\n§e/ghg kind §7- abrir el menú de tipos de Madre (fase de preparación)\n§e/ghg lang <idioma> §7- cambiar tu idioma\n§e/ghg help §7- mostrar esta ayuda\n§e/ghg §7- abre el menú gráfico (sin memorizar comandos)\n§7Juego: la Madre IA te persigue; rompe todos los altares y escapa. Comandos de admin: §f/ghga help\n§e/ghg spectate §7- entrar/salir de espectador (con partida en curso)"
ghg.help.admin: "§6========== Comandos de admin de GHG ==========\n§7[Partida]\n§e/ghga hunter start [jugadores...] §7- iniciar con una Madre IA (sin nombres = todos los del área)\n§e/ghga hunter mother <jugador> [supervivientes...] §7- iniciar con un jugador como Madre\n§e/ghga hunter kind [tipo] §7- elegir el tipo de Madre (sin argumento = menú)\n§e/ghga hunter stop | status | stats §7- terminar / estado / resultados recientes\n§e/ghga hunter test [mother] §7- partida de prueba en solitario\n§e/ghga hunter queue [start|stop] §7- ver cola / empezar ya / vaciar\n§7[Terreno de caza]\n§e/ghga tool §7- obtener la herramienta de selección (trigo)\n§e/ghga pos1 | pos2 §7- fijar las dos esquinas (o clic izq./der. con la herramienta)\n§e/ghga save <nombre> | list | load <nombre> | delete <nombre> §7- gestión de áreas\n§7[Otros]\n§e/ghga giveitem <id de objeto> §7- dar un objeto\n§e/ghga reload | selftest | lang <idioma> | status §7- mantenimiento"
