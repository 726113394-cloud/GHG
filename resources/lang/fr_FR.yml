# ---- 选择菜单里的详细描述（/ghg kind 与 /ghg role）----
hunter.mother.kind.desc.sprinter: "§eVitesse§7 : une accélération courte pour revenir à portée"
hunter.mother.kind.desc.charger: "§cCharge§7 : course rectiligne, tout contact étourdit"
hunter.mother.kind.desc.archer: "§cDistance§7 : un tir à distance qui compte comme une blessure"
hunter.mother.kind.desc.alchemist: "§dContrôle§7 : ralentissement à distance pour couper les rotations"
hunter.mother.kind.desc.walker: "§bEngagement§7 : téléportation dans le dos ; tu es figée un instant"
hunter.mother.kind.desc.watcher: "§5Furtivité§7 : approche invisible et chasse les isolés"
hunter.mother.kind.desc.weaver: "§aZone§7 : filet de ralentissement autour de toi, punit les groupes"
hunter.mother.kind.desc.pearl_lady: "§dFonceuse§7 : saute sur l’autel, mais paie d’un premier pas lent — touche vite ou perds le saut"
hunter.skill.sprint.desc: "Donne Vitesse I pendant 6 secondes.\nIdéal en poursuite rectiligne et pour couper les sauvetages."
hunter.skill.dash.desc: "Ruée d’environ 8 à 9 blocs dans la direction visée.\nToucher quelqu’un (rayon 2,2) l’étourdit 2 s ;\nla Mère ne subit aucun malus.\nUne Mère IA fonce vers le survivant le plus proche."
hunter.skill.arrow.desc: "Tire une flèche d’os ; le toucher compte comme une blessure normale (2 = à terre).\nAucun ralentissement : dégâts purs en échange de la portée."
hunter.skill.bolt.desc: "Le carreau explose en potion jetable à l’impact :\nLenteur I pendant 3 s dans un rayon de 3 blocs."
hunter.skill.teleport.desc: "Téléportation à environ 1,8 bloc derrière la cible.\nTu restes figée 2 secondes après l’arrivée."
hunter.skill.vanish.desc: "Invisibilité + Vitesse II pendant 7 secondes.\nToucher un survivant retire la vitesse (l’invisibilité reste)."
hunter.skill.snare.desc: "Déploie un filet de ralentissement autour de toi :\nLenteur I pendant 3 s dans un rayon de 7 blocs."
hunter.skill.pearl.desc: "Saute environ 10 blocs vers ta visée (la version Mère de la perle de téléportation).\nÀ l’atterrissage tu prends Lenteur I 4s ;\nsi tu touches un survivant pendant ces 4s, la lenteur saute aussitôt\net laisse place aux 2s de récupération de l’attaque.\nUne Mère IA saute derrière sa cible."
