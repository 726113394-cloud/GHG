menu.flow.p1: "§f1. Préparation§7 (25 s)\nBouge librement, casse les caisses, choisis un rôle (menu automatique).\nLes autels ne se chargent pas encore ; la Mère est figée.\n§f2. Traque§7\nMaintiens Shift sur un autel pour remplir la barre commune ;\nla Mère à 6 blocs la fait reculer.\n§f3. Évasion§7\nÀ 100 %, un autel au hasard devient la sortie : Shift 4 s.\nS’il ne reste qu’un survivant, une trappe s’ouvre."
menu.flow.p2: "§fToutes les actions clés sont sur Shift§7\ncharger / secourir / soigner / s’auto-soigner / s’échapper / porter / se dégager.\nClic gauche : la hache de la Mère. Clic droit : compétences et objets.\n§fTous les autels partagent une barre§7\n0,9 %/s en solo (1,125 % pour l’ingénieur), pas d’addition.\nSous la garde de la Mère, -0,6 %/s ;\nelle peut aussi renforcer un autel 50 s en le frappant."
menu.flow.p3: "§fUn coup blesse, deux coups à terre§7\nChaque coup donne Vitesse II 2 s puis Lenteur I 1,5 s.\nOn soigne : équipier 8 s / soi-même 20 s (nourriture >= 8).\n§fUne fois à terre§7\nLa Mère peut te clouer sur un autel : 60 -> 30 -> 5 s et dehors.\nUn équipier avec Shift 4 s te libère (tu reviens blessé) ;\nsans aide, tu te relèves blessé après 15 s."
menu.flow.p4: "§fVictoire et défaite§7\nUne évasion -> les survivants gagnent ; tous à terre -> la Mère gagne.\nTemps écoulé (20 min) = égalité.\n§fPartage de l’argent§7\nEntrée 50 + bonus serveur 500 forment la cagnotte, répartie aux points :\ncharge 2/s, sauvetage 15, évasion 25 ; coup 5, mise à terre 10, élimination 40.\nLa Mère ne prend que sur le bonus, au maximum 50 %."
