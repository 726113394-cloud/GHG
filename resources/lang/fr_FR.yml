hunter.kindmenu.passive-common: "Vision —— reste immobile 3 s et les survivants à 40 blocs brillent"
hunter.role.effect.icer: "Clic droit pour lancer la Boule de Glace.\nToucher la Mère -> 4 s d’étourdissement ; si elle porte quelqu’un,\nla personne tombe au sol.\nNon distribué face à une Mère IA (personne à viser)."
hunter.role.passive.icer: "Aucun"
hunter.role.effect.guardian: "Clic droit avec l’Amulette : sauvetage x3 pendant 15 s.\nIl faut toujours rester à côté et maintenir Shift."
hunter.role.passive.guardian: "Sauvetage et soin x1,3"
hunter.role.effect.lancer: "Clic droit avec la Lance : élan d’environ 4 à 5 blocs.\nPour franchir un trou ou esquiver un coup."
hunter.role.passive.lancer: "Portée du battement x1,5"
hunter.role.effect.engineer: "Clic droit pour monter une palissade 3x2.\nElle casse en 3 coups : la Mère et les ingénieurs peuvent,\nles autres survivants non."
hunter.role.passive.engineer: "Plafond de charge des autels x1,25 (1,125 %/s)"
hunter.role.effect.runner: "Clic droit avec l’Adrénaline : Vitesse I pendant 4 s,\npuis 2 s de Lenteur (version atténuée de GHG)."
hunter.role.passive.runner: "Aucun"
hunter.role.effect.wraith: "Clic droit sur la Cape d’ombre : invisible 6s.\nLa vue passive de la Mère (3s immobile) applique Brillance,\nqui te détoure même invisible."
