# ---- GHG 自有文案（新键，旧键一律保留） ----
ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- quitter la partie en cours\n§e/ghg join §7- rejoindre la file (départ auto dès assez de joueurs)\n§e/ghg info §7- afficher ton état\n§e/ghg kind §7- ouvrir le menu des types de Mère (phase de préparation)\n§e/ghg lang <langue> §7- changer ta langue\n§e/ghg help §7- afficher cette aide\n§e/ghg §7- ouvre le menu graphique (aucune commande à retenir)\n§7Jeu : la Mère IA te traque, brise tous les autels puis échappe-toi. Commandes admin : §f/ghga help\n§e/ghg spectate §7- entrer/sortir du mode spectateur (partie en cours)"
ghg.help.admin: "§6========== Commandes admin GHG ==========\n§7[Partie]\n§e/ghga hunter start [joueurs...] §7- démarrer avec une Mère IA (sans nom = tous ceux de la zone)\n§e/ghga hunter mother <joueur> [survivants...] §7- démarrer avec un joueur comme Mère\n§e/ghga hunter kind [type] §7- choisir le type de Mère (sans argument = menu)\n§e/ghga hunter stop | status | stats §7- arrêter / état / résultats récents\n§e/ghga hunter test [mother] §7- partie d'essai en solo\n§e/ghga hunter queue [start|stop] §7- voir la file / lancer maintenant / vider\n§7[Terrain de chasse]\n§e/ghga tool §7- obtenir l'outil de sélection (blé)\n§e/ghga pos1 | pos2 §7- définir les deux coins (ou clic gauche/droit avec l'outil)\n§e/ghga save <nom> | list | load <nom> | delete <nom> §7- gestion des zones\n§7[Autres]\n§e/ghga giveitem <id d'objet> §7- donner un objet\n§e/ghga reload | selftest | lang <langue> | status §7- maintenance"
ghg.help.lang-usage: "§eUtilisation : /ghg lang <{0}>"
