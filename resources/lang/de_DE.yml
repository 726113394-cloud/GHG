# ---- GHG 自有文案（新键，旧键一律保留） ----
ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- laufendes Spiel verlassen\n§e/ghg join §7- Warteschlange beitreten (startet automatisch, sobald genug da sind)\n§e/ghg info §7- eigenen Status anzeigen\n§e/ghg kind §7- Menü der Mutter-Arten öffnen (Vorbereitungsphase)\n§e/ghg lang <Sprache> §7- eigene Sprache wechseln\n§e/ghg help §7- diese Hilfe anzeigen\n§e/ghg §7- öffnet das GUI-Menü (keine Befehle merken)\n§7Spiel: Die KI-Mutter jagt dich; zerstöre alle Altäre und entkomme. Admin-Befehle: §f/ghga help\n§e/ghg spectate §7- Zuschauermodus betreten/verlassen (während einer Runde)"
ghg.help.admin: "§6========== GHG Admin-Befehle ==========\n§7[Spiel]\n§e/ghga hunter start [Spieler...] §7- Start mit KI-Mutter (ohne Namen = alle im Gebiet)\n§e/ghga hunter mother <Spieler> [Überlebende...] §7- Start mit einem Spieler als Mutter\n§e/ghga hunter kind [Art] §7- Mutter-Art wählen (ohne Argument = Menü)\n§e/ghga hunter stop | status | stats §7- beenden / Status / letzte Ergebnisse\n§e/ghga hunter test [mother] §7- Einzelspieler-Testspiel\n§e/ghga hunter queue [start|stop] §7- Warteschlange zeigen / sofort starten / leeren\n§7[Jagdgebiet]\n§e/ghga tool §7- Auswahlwerkzeug holen (Weizen)\n§e/ghga pos1 | pos2 §7- beide Ecken setzen (oder Links-/Rechtsklick mit dem Werkzeug)\n§e/ghga save <Name> | list | load <Name> | delete <Name> §7- Gebietsverwaltung\n§7[Sonstiges]\n§e/ghga giveitem <Item-ID> §7- ein Item geben\n§e/ghga reload | selftest | lang <Sprache> | status §7- Wartung"
