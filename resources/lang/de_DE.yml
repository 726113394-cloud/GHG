# ---- 选择菜单里的详细描述（/ghg kind 与 /ghg role）----
hunter.mother.kind.desc.sprinter: "§eTempo§7: kurzer Schub, um Abstand zu schließen"
hunter.mother.kind.desc.charger: "§cAnsturm§7: gerader Sprint; wer getroffen wird, ist betäubt"
hunter.mother.kind.desc.archer: "§cDistanz§7: ein Schuss aus der Ferne, zählt als normale Verletzung"
hunter.mother.kind.desc.alchemist: "§dKontrolle§7: Verlangsamung aus der Ferne, schneidet Wege ab"
hunter.mother.kind.desc.walker: "§bZugriff§7: Teleport hinter das Ziel; du erstarrst kurz"
hunter.mother.kind.desc.watcher: "§5Heimlichkeit§7: unsichtbar heranschleichen und Einzelne greifen"
hunter.mother.kind.desc.weaver: "§aFläche§7: Verlangsamungsnetz um dich, bestraft Gruppen"
hunter.mother.kind.desc.pearl_lady: "§dStürmerin§7: springt direkt an den Altar, zahlt aber mit einem langsamen ersten Schritt — schnell treffen oder verschenken"
hunter.skill.sprint.desc: "Gibt 6 Sekunden lang Tempo I.\nGut für gerade Verfolgungen und zum Abschneiden von Rettungen."
hunter.skill.dash.desc: "Stürmt etwa 8-9 Blöcke in Blickrichtung.\nTreffer (Radius 2,2) -> 2 s Betäubung;\ndie Mutter selbst erleidet keinen Malus.\nEine KI-Mutter stürmt stattdessen auf den nächsten Überlebenden."
hunter.skill.arrow.desc: "Feuert einen Knochenpfeil; ein Treffer zählt als normale Verletzung (2 = am Boden).\nKeine Verlangsamung - reiner Schaden gegen Reichweite."
hunter.skill.bolt.desc: "Der Bolzen platzt am Einschlag als Wurftrank:\nLangsamkeit I für 3 s im Radius von 3 Blöcken."
hunter.skill.teleport.desc: "Teleportiert etwa 1,8 Blöcke hinter das Ziel.\nDanach bist du 2 Sekunden bewegungs- und angriffsunfähig."
hunter.skill.vanish.desc: "Unsichtbarkeit + Tempo II für 7 Sekunden.\nEin Treffer beendet das Tempo (Unsichtbarkeit bleibt)."
hunter.skill.snare.desc: "Wirft ein Verlangsamungsnetz um dich:\nLangsamkeit I für 3 s im Radius von 7 Blöcken."
hunter.skill.pearl.desc: "Springt etwa 10 Blöcke in Blickrichtung (die Mutter-Version der Teleportperle).\nNach der Landung Langsamkeit I für 4s;\ntriffst du in diesen 4s einen Überlebenden, endet sie sofort\nund es bleibt nur die 2s Erholung nach einem Angriff.\nEine KI-Mutter springt hinter ihr Ziel."
