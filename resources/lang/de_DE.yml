menu.flow.p1: "§f1. Vorbereitung§7 (25 s)\nFrei bewegen, Kisten zerschlagen, Rolle wählen (Menü kommt automatisch).\nAltäre laden noch nicht; die Mutter ist festgesetzt.\n§f2. Jagd§7\nShift auf einem Altar halten füllt die gemeinsame Leiste;\ndie Mutter im Umkreis von 6 Blöcken drückt sie zurück.\n§f3. Flucht§7\nBei 100 % wird ein zufälliger Altar zum Fluchtpunkt: 4 s Shift.\nBleibt nur ein Überlebender, öffnet sich eine Luke."
menu.flow.p2: "§fAlle wichtigen Aktionen laufen über Shift§7\nLaden / Retten / Heilen / Selbstheilung / Flucht / Tragen / Losreißen.\nLinksklick ist die Axt der Mutter, Rechtsklick Fähigkeiten und Items.\n§fAlle Altäre teilen eine Leiste§7\n0,9 %/s allein (1,125 % als Ingenieur), kein Stapeln.\nUnter Bewachung -0,6 %/s;\nsie kann einen Altar auch 50 s lang härten."
menu.flow.p3: "§fEin Treffer verletzt, zwei werfen um§7\nJeder Treffer gibt 2 s Tempo II, danach 1,5 s Langsamkeit I.\nHeilung: Teamkollege 8 s / selbst 20 s (Sättigung >= 8).\n§fNach dem Umwerfen§7\nDie Mutter kann dich an einen Altar nageln: 60 -> 30 -> 5 s und raus.\nEin Teamkollege befreit dich mit 4 s Shift (du kommst verletzt zurück);\nallein krochst du nach 15 s verletzt hoch."
menu.flow.p4: "§fSieg und Niederlage§7\nEine Flucht -> Überlebende gewinnen; alle umgeworfen -> Mutter gewinnt.\nZeitablauf (20 Min) ist unentschieden.\n§fGeldverteilung§7\nStartgeld 50 + Serverbonus 500 bilden den Pool, verteilt nach Aktionspunkten:\nLaden 2/s, Rettung 15, Flucht 25; Treffer 5, Umwerfen 10, Ausschalten 40.\nDie Mutter nimmt nur aus dem Bonus, höchstens 50 %."
