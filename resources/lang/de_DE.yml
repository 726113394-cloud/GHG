hunter.kindmenu.passive-common: "Sicht —— 3 s stillstehen, dann leuchten Überlebende im Umkreis von 40 Blöcken"
hunter.role.effect.icer: "Rechtsklick wirft den Eisball.\nTreffer auf die Mutter -> 4 s Betäubung; trägt sie jemanden,\nfällt die Person zu Boden.\nGegen eine KI-Mutter nicht vergeben (kein Ziel)."
hunter.role.passive.icer: "Keine"
hunter.role.effect.guardian: "Rechtsklick mit dem Amulett: Rettung x3 für 15 Sekunden.\nMan muss weiterhin danebenstehen und Shift halten."
hunter.role.passive.guardian: "Rettung und Heilung x1,3"
hunter.role.effect.lancer: "Rechtsklick mit dem Speer: etwa 4-5 Blöcke Vorstoß.\nZum Überqueren von Lücken und Ausweichen eines Schlags."
hunter.role.passive.lancer: "Herzschlag-Reichweite x1,5"
hunter.role.effect.engineer: "Rechtsklick baut einen 3x2 Holzzaun am Fadenkreuz.\nEr hält 3 Treffer: Mutter und Ingenieure können ihn zerstören,\nandere Überlebende nicht."
hunter.role.passive.engineer: "Obergrenze der Altar-Ladung x1,25 (1,125 %/s)"
hunter.role.effect.runner: "Rechtsklick mit Adrenalin: Tempo I für 4 Sekunden,\ndanach 2 Sekunden Langsamkeit (abgeschwächte GHG-Version)."
hunter.role.passive.runner: "Keine"
hunter.role.effect.wraith: "Rechtsklick auf den Schattenmantel: 6s unsichtbar.\nDie passive Sicht der Mutter (3s stillstehen) vergibt Leuchten,\ndas dich auch unsichtbar umrandet."
