# ---- 选择菜单里的详细描述（/ghg kind 与 /ghg role）----
hunter.mother.kind.desc.sprinter: "§e速度型§7：短时加速，用来拉平距离、追直线"
hunter.mother.kind.desc.charger: "§c爆发型§7：直线猛冲，撞上就晕，适合翻墙拦人"
hunter.mother.kind.desc.archer: "§c远程型§7：隔着距离打一发，命中算一次受伤"
hunter.mother.kind.desc.alchemist: "§d控场型§7：远程投掷减速，卡住逃生者的转移路线"
hunter.mother.kind.desc.walker: "§b切入型§7：瞬间贴到身后，代价是自己硬直一下"
hunter.mother.kind.desc.watcher: "§5潜行型§7：隐身接近，专抓落单的人"
hunter.mother.kind.desc.weaver: "§a范围型§7：以自身为中心撒减速网，专治抱团"
hunter.mother.kind.desc.pearl_lady: "§d突进型§7：闪进阵眼，代价是先慢一拍，所以要么立刻打到人、要么白闪"
hunter.skill.sprint.desc: "自身获得速度Ⅰ，持续 6 秒。\n追直线、绕开救援点时最有用。"
hunter.skill.dash.desc: "朝视角方向猛冲约 8~9 格。\n撞到人（半径 2.2 格）→ 对方眩晕 2 秒；\n母体自己没有任何 debuff。\nAI 母体则由它朝最近的逃生者冲。"
hunter.skill.arrow.desc: "射出骨矢，命中算一次正常受伤（两下倒地）。\n不给任何减速——纯伤害，靠射程换血。"
hunter.skill.bolt.desc: "弩箭命中处炸出喷溅药水，\n半径 3 格内的逃生者缓慢Ⅰ 3 秒。"
hunter.skill.teleport.desc: "传送到目标身后约 1.8 格。\n落地后自己硬直 2 秒，不能动也不能砍。"
hunter.skill.vanish.desc: "隐身 + 速度Ⅱ，持续 7 秒。\n打中逃生者后加速立刻消失（隐身保留）。"
hunter.skill.snare.desc: "以自身为中心甩出一圈减速网，\n半径 7 格内的逃生者缓慢Ⅰ 3 秒。"
hunter.skill.pearl.desc: "朝准星方向闪约 10 格（母体版传送珍珠）。\n落地后自己缓慢Ⅰ 4 秒；\n这 4 秒内打中逃生者 → 缓慢立刻解除，改成攻击自带的 2 秒后摇。\nAI 母体则闪到目标身后。"
