hunter.kindmenu.passive-common: "透视 —— 站住不动 3 秒，40 格内逃生者发光"
hunter.role.effect.icer: "右键砸出凝冰球。\n命中母体 → 眩晕 4 秒；若她正抱着人，\n倒地者会直接落地。\nAI 母体局不分配这个职业（没有真人母体可砸）。"
hunter.role.passive.icer: "无"
hunter.role.effect.guardian: "右键使用救赎护符：15 秒内救人读条 ×3。\n仍然要走到队友 / 法阵旁按住 Shift，不能远程救人。"
hunter.role.passive.guardian: "救援与治疗读条 ×1.3"
hunter.role.effect.lancer: "右键冲刺矛，向前突进约 4~5 格。\n可以用来越过缺口、躲开一次砍击。"
hunter.role.passive.lancer: "心跳听距 ×1.5（更早听到母体靠近）"
hunter.role.effect.engineer: "右键在准星处架一段 3×2 木栅栏。\n栅栏要被打 3 下才塌：母体和工程师能拆，\n其他逃生者打不动。"
hunter.role.passive.engineer: "破阵蓄力上限 ×1.25（1.125%/秒）"
hunter.role.effect.runner: "右键肾上腺素：速度Ⅰ 4 秒，\n结束后 2 秒缓慢（GHG 弱化版）。"
hunter.role.passive.runner: "无"
hunter.role.effect.wraith: "右键隐身斗篷：隐身 6 秒。\n母体静止 3 秒触发的被动透视会给你挂发光，\n隐身挡不住那圈轮廓。"
