menu.flow.title: "游戏流程"
menu.flow.book-name: "§6GHG 玩法说明"
menu.flow.page: "§7第 {0}/{1} 页"
menu.flow.prev: "§7← 上一页"
menu.flow.next: "§7下一页 →"
menu.flow.p1: "§f1. 准备阶段§7（25 秒）\n可以自由移动、敲道具箱、选职业（自动弹菜单）。\n法阵此时不能破，母体定身。\n§f2. 猎杀阶段§7\n按住 Shift 站在法阵上推共享进度，\n母体进 6 格内会把它推回去。\n§f3. 撤离阶段§7\n进度满 100% 后随机一座法阵变撤离点，按住 Shift 4 秒走人；\n只剩 1 人时会开地窖，可以独自撤离。"
menu.flow.p2: "§f所有关键动作都是 Shift§7\n破阵 / 救援 / 治疗 / 自愈 / 撤离 / 抱起 / 挣脱。\n左键是母体的战斧，右键是技能与道具。\n§f法阵共用一条进度§7\n单人 0.9%/秒（工程师 1.125%），人多不叠加。\n母体守机时净 −0.6%/秒，进度会倒退；\n她还能砸红石块，把该阵加固 50 秒。"
menu.flow.p3: "§f挨一次是受伤，两次倒地§7\n命中瞬间给速度Ⅱ 2 秒，结束接缓慢Ⅰ 1.5 秒。\n受伤能治：队友 8 秒 / 自己 20 秒（要饱食度 ≥ 8）。\n§f倒地之后§7\n母体可以把你钉在法阵上当椅子：60 → 30 → 5 秒放飞。\n队友按住 Shift 4 秒拆阵救人，救起来是受伤状态；\n没人处理 15 秒会自己爬回受伤。"
menu.flow.p4: "§f胜负§7\n有人撤离成功 → 逃生者胜；全员被淘汰 → 母体胜。\n时间到（20 分钟）判平局。\n§f钱怎么分§7\n入场费 50 + 服务器保底 500 是奖池，按行动分分配：\n破阵每秒 2、救人 15、撤离 25；母体命中 5、击倒 10、淘汰 40。\n母体只分保底，最多 50%。"
