ghg.help.player: "§a=== GHG · Gost's HunterGame ===\n§e/ghg leave §7- 退出当前对局\n§e/ghg join §7- 排队开局（人够自动开）\n§e/ghg info §7- 查看自己的状态\n§e/ghg kind §7- 打开母体种类菜单（准备阶段）\n§e/ghg lang <语言> §7- 切换自己的语言\n§e/ghg help §7- 显示这份帮助\n§e/ghg §7- 打开图形菜单（不用记命令）\n§7玩法：AI 母体在猎场追杀，逃生者破完法阵后撤离。管理命令见 §f/ghga help\n§e/ghg spectate §7- 进/出观战（对局已开始时用）"
ghg.help.admin: "§6========== GHG 管理员命令 ==========\n§7［对局］\n§e/ghga hunter start [玩家...] §7- AI 母体开局（不带玩家名=取区域内所有人）\n§e/ghga hunter mother <母体玩家> [逃生者...] §7- 玩家当母体开局\n§e/ghga hunter kind [种类] §7- 选母体种类（不带参数=打开菜单）\n§e/ghga hunter stop | status | stats §7- 结束 / 状态 / 最近战绩\n§e/ghga hunter test [mother] §7- 单人试玩\n§e/ghga hunter queue [start|stop] §7- 查看队列 / 立即开局 / 清空队列\n§7［猎场圈地］\n§e/ghga tool §7- 拿选区工具（小麦）\n§e/ghga pos1 | pos2 §7- 设两个角（也可以直接用工具左键/右键点）\n§e/ghga save <名称> | list | load <名称> | delete <名称> §7- 区域管理\n§7［其它］\n§e/ghga giveitem <道具ID> §7- 发一件道具\n§e/ghga reload | selftest | lang <语言> | status §7- 维护"
